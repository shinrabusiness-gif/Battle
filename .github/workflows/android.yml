# Kostenloser Cloud-Build (GitHub Actions) als Alternative zum Bauen auf dem Handy.
name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit-Tests (Mathe, Focus-Stacking, Mosaik mit Desktop-OpenCV)
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: APK bauen
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: UltraScope-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
