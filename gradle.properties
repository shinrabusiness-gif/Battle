# Speicher bewusst moderat, damit der Build auch in Termux auf dem Handy laeuft.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kotlin im Gradle-Prozess kompilieren (kein zusaetzlicher Daemon -> weniger RAM in Termux)
kotlin.compiler.execution.strategy=in-process
# WICHTIG fuer Termux: die ARM-aapt2-Ueberschreibung wird NICHT hier gesetzt, sondern
# von scripts/termux-setup.sh in ~/.gradle/gradle.properties eingetragen, damit dieses
# Projekt auf PC/CI unveraendert baut.
